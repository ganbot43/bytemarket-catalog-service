server:
  port: ${CATALOG_SERVICE_PORT:8082}

spring:
  application:
    name: bytemarket-catalog-service
  profiles:
    active: ${SPRING_PROFILE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME_CATALOG:bytemarket_catalog}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:mysql}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      # /api/upload/image admite hasta 5 MB. El límite de Spring por defecto
      # es 1 MB y cortaba la subida antes de llegar al controlador.
      max-file-size: 5MB
      max-request-size: 10MB
  # Mensajería: preparada, todavía sin usar.
  #
  # Hoy esta sección es inerte porque ningún pom.xml incluye AMQP ni Kafka:
  # Spring la ignora. Queda escrita para cuando se necesite (por ejemplo,
  # avisar al catálogo de un pedido sin que order-service dependa de él).
  # Para activarla hay que añadir al pom:
  #   spring-boot-starter-amqp   (RabbitMQ, ya en docker-compose)
  #   spring-kafka               (Kafka, ya en docker-compose)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9094}
    consumer:
      group-id: ${KAFKA_GROUP:bytemarket-catalog}
      auto-offset-reset: earliest

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Valores por defecto para cuando se arranca sin el perfil local. Tienen que
# coincidir con application-local.yml: si el secreto diverge, este servicio
# rechaza los tokens que firma user-service.
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}
aws:
  region: ${S3_REGION:us-east-2}
  access:
    key: ${S3_ACCESS_KEY_ID:}
  secret:
    key: ${S3_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${S3_BUCKET:}
    root-prefix: ${S3_ROOT_PREFIX:bytemarket}
