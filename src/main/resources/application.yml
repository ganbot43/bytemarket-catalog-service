server:
  port: ${CATALOG_SERVICE_PORT:8082}

spring:
  application:
    name: bytemarket-catalog-service
  profiles:
    active: ${SPRING_PROFILE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME_CATALOG:bytemarket_catalog}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:mysql}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      # /api/upload/image admite hasta 5 MB. El límite de Spring por defecto
      # es 1 MB y cortaba la subida antes de llegar al controlador.
      max-file-size: 5MB
      max-request-size: 10MB
  # ── Mensajería ───────────────────────────────────────────────
  # Este servicio CONSUME la cola de stock que publica order-service: ahí
  # llegan los descuentos por venta y las devoluciones por cancelación (ver
  # RabbitConfig y StockListener).
  #
  # De Kafka no consume nada. El topic bytemarket.pedidos lleva los eventos
  # del pedido y lo lee support-service para avisar al cliente; al catálogo
  # no le incumben. La sección de abajo se queda porque el .env la rellena
  # para todos los servicios por igual.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Reintentos del consumidor ante fallos transitorios. Agotados, el
    # mensaje va a la cola de fallidos en vez de reencolarse sin fin y
    # bloquear a los demás.
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 4
          multiplier: 2
        default-requeue-rejected: false
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9094}
    consumer:
      group-id: ${KAFKA_GROUP:bytemarket-catalog}
      auto-offset-reset: earliest

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Valores por defecto para cuando se arranca sin el perfil local. Tienen que
# coincidir con application-local.yml: si el secreto diverge, este servicio
# rechaza los tokens que firma user-service.
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}
aws:
  region: ${S3_REGION:us-east-2}
  access:
    key: ${S3_ACCESS_KEY_ID:}
  secret:
    key: ${S3_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${S3_BUCKET:}
    root-prefix: ${S3_ROOT_PREFIX:bytemarket}

# ── Sonda de salud ───────────────────────────────────────────
# Solo se expone "health": los demás endpoints del actuator (env, beans,
# mappings) revelan configuración interna y no hacen falta aquí.
# Lo consulta el healthcheck de Docker, que así espera a que el servicio
# esté REALMENTE listo —base de datos incluida— y no solo a que el puerto
# responda.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
